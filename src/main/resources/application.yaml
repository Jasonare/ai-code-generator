server:
  port: 10226
  servlet:
    context-path: /acg

spring:
  application:
    name: ai-code-generator-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_generator?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true
    username: root
    password: 123456
  profiles:
    active: local

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ryan.aicodegenerator.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


